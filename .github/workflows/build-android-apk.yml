name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch original Outfits source
        run: |
          git clone https://github.com/vaclavparma/outfits-app.git src
          cd src
          git checkout 2818cfc35f56ed4a66e13746fcd4dec5f214f455

      - name: Apply Simplified Chinese patch
        run: python3 scripts/apply_zh.py

      - name: Apply related outfit feature
        run: python3 scripts/apply_related_looks.py

      - name: Apply new wardrobe and outfits navigation
        run: python3 scripts/apply_new_navigation.py

      - name: Regenerate Android project files
        run: |
          cd src
          rm -rf android
          flutter create --platforms=android --org eu.oscillator --project-name outfits .

      - name: Get dependencies
        run: |
          cd src
          flutter pub get

      - name: Generate localizations
        run: |
          cd src
          flutter gen-l10n

      - name: Build release APK
        run: |
          cd src
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: outfits-zh-release-apk
          path: src/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
